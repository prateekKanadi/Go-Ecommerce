<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our Site</title>
    <style>
        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            height: auto;
            color: #fff;
        }

        /* Home container styling */
        .home-container {
            flex: 1;
            margin-top: 150px;
            margin-bottom: 30px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;            
            text-align: center;            
        }

        .home-container h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 700;
        }

        .home-container p {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #e2e2e2;
        }

        .home-container .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            color: #fff;
            background-color: #5a67d8;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .home-container .btn:hover {
            background-color: #4c51bf;
        }

        .home-container .btn-secondary {
            background-color: #a0aec0;
        }

        .home-container .btn-secondary:hover {
            background-color: #718096;
        }

        /* Header styling */
        header {
            width: 100%;
            background-color: #fff;
            padding: 15px 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .welcome-message {
            font-size: 1.2em;
            color: #5a67d8;
            margin-right: 700px;
            margin-bottom: 15px;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-left: 80px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 15px;
            background-color: #5a67d8;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        /* Footer styling */
        footer {
            position: relative;                                    
            padding: 10px 0;  
            text-align: center;
            font-size: 0.9em;          
            color: #fff;
            width: 100%;
            background-color: #333;
        }

        .logo-container {
            display: flex;
            align-items: center;
            padding: 10px;
        }
    
        .company-logo {
            width: auto;
            max-height: 80px;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo-container">
            <img src="/images/company-logo.jpg" alt="Company Logo" class="company-logo">
        </div>
        <div class="welcome-message">
            Home Page              
        </div>
        <div class="btn-container">            
            <a href="/" class="btn" title="View Home Page">Home</a>                
            <a href="/prod/cart" class="btn" title="View My Cart">My Cart</a>  
        </div>
    </header> 

    <div class="home-container">
        <h1>Welcome to Our Platform!</h1>
        <p>Your gateway to amazing products and services. Join us today and start exploring!</p>
        
        <a href="prod/auth/register" class="btn">Get Started</a>
        <a href="prod/auth/login" class="btn btn-secondary">Login</a>
        <a href="/prod/products" class="btn" title="View My Products">View Products</a>
    </div>

    <footer>&copy; 2023 Your Company</footer>

</body>
</html>
