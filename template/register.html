<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            height: auto;
            color: #333;
        }

        /* Registration container styling */
        .register-container {
            flex: 1;
            margin-top: 150px;
            margin-bottom: 30px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px; /* Increased to accommodate two-column layout */
            text-align: center;
        }

        .register-container h2 {
            margin-bottom: 20px;
            font-size: 1.8em;
            color: #ff6b6b;
            font-weight: 600;
        }

        /* Error message styling */
        .error-message {
            color: #d9534f;
            background-color: #f2dede;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        /* Two-column layout */
        .form-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 12px;
        }

        .form-row input {
            width: 48%; /* Distribute fields in two columns */
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        /* Submit button styling */
        .register-container input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #ff6b6b;
            border: none;
            color: #fff;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 12px;
        }

        .register-container input[type="submit"]:hover {
            background-color: #e55a5a;
        }

        /* Link styling */
        .register-container a {
            display: block;
            margin-top: 20px;
            color: #ff6b6b;
            text-decoration: none;
        }

        .register-container a:hover {
            text-decoration: underline;
        }

        /* Header styling */
        header {
            width: 100%;
            background-color: #fff;
            padding: 15px 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .welcome-message {
            font-size: 1.2em;
            color: #5a67d8;
            margin-right: 700px;
            margin-bottom: 15px;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-left: 80px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 15px;
            background-color: #5a67d8;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        /* Footer styling */
        footer {
            position: relative;                                    
            padding: 10px 0;  
            text-align: center;
            font-size: 0.9em;          
            color: #fff;
            width: 100%;
            background-color: #333;
        }

        .logo-container {
            display: flex;
            align-items: center;
            padding: 10px;
        }
    
        .company-logo {
            width: auto;
            max-height: 80px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo-container">
            <img src="/images/company-logo.jpg" alt="Company Logo" class="company-logo">
        </div>
        <div class="welcome-message">
            Register Page              
        </div>
        <div class="btn-container">            
            <a href="/" class="btn" title="View Home Page">Home</a>                
            <a href="/prod/cart" class="btn" title="View My Cart">My Cart</a>  
        </div>
    </header> 

    <div class="register-container">
        <h2>Create an Account</h2>

        <!-- Display error message if any -->
        {{if .Error}}
        <div class="error-message">{{.Error}}</div>
        {{end}}

        <form action="/prod/auth/register" method="POST">
            <!-- First row of inputs -->
            <div class="form-row">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <!-- Second row of inputs -->
            <div class="form-row">
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                <input type="text" name="name" placeholder="Name" required>
            </div>

            <!-- Third row of inputs -->
            <div class="form-row">
                <input type="text" name="houseNo" placeholder="House Number" required>
                <input type="text" name="landmark" placeholder="LandMark" required>
            </div>

            <!-- Fourth row of inputs -->
            <div class="form-row">
                <input type="text" name="city" placeholder="City" required>
                <input type="text" name="state" placeholder="State" required>
            </div>

            <!-- Fifth row of inputs -->
            <div class="form-row">
                <input type="text" name="pincode" placeholder="Pincode" required>
                <input type="text" name="phoneNumber" placeholder="Phone Number" required>
            </div>

            <!-- Submit button -->
            <input type="submit" value="Register">
        </form>

        <a href="/prod/auth/login">Already have an account? Login here</a>
    </div>

    <footer>&copy; 2023 Your Company</footer>

</body>
</html>
