<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Login Page</title>
    <style>
        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            height: auto;
            color: #333;
        }

        /* Container styling */
        .login-container {
            flex: 1;
            margin-top: 140px;
            margin-bottom: 30px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #444;
            font-weight: 600;
            font-size: 1.5em;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 90%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .login-container input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #5cb85c;
            border: none;
            color: #fff;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-container input[type="submit"]:hover {
            background-color: #4cae4c;
        }

        .login-container a {
            display: inline-block;
            margin-top: 20px;
            color: #5cb85c;
            text-decoration: none;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #d9534f;
            background-color: #f2dede;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        /* Header styling */
        header {
            width: 100%;
            background-color: #fff;
            padding: 15px 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .welcome-message {
            font-size: 1.2em;
            color: #5a67d8;
            margin-right: 700px;
            margin-bottom: 15px;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-left: 80px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 15px;
            background-color: #5a67d8;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        /* Footer styling */
        footer {
            position: relative;                                    
            padding: 10px 0;  
            text-align: center;
            font-size: 0.9em;          
            color: #fff;
            width: 100%;
            background-color: #333;
        }   
        
        .logo-container {
            display: flex;
            align-items: center;
            padding: 10px;
        }
    
        .company-logo {
            width: auto;
            max-height: 80px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo-container">
            <img src="/images/company-logo.jpg" alt="Company Logo" class="company-logo">
        </div>
        <div class="welcome-message">
            Login Page              
        </div>
        <div class="btn-container">            
            <a href="/" class="btn" title="View Home Page">Home</a>                
            <a href="/prod/cart" class="btn" title="View My Cart">My Cart</a>  
        </div>
    </header> 

    <div class="login-container">
        <h2>Login</h2>

        {{if .Error}}
        <div class="error-message">{{.Error}}</div>
        {{end}}

        <form action="/prod/auth/login" method="POST">
            <input type="text" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="submit" value="Login">
        </form>
        <a href="#">Forgot your password?</a>
        <a href="/prod/auth/register">Don't have an account? Register here</a>
    </div>

    <footer>&copy; 2023 Your Company</footer>

</body>
</html>
